<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="20" y="16" width="860" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="38" font-size="13" font-weight="700" fill="#0f172a">① 로그인 안 된 상태에서 접속</text>

  <g font-size="11" fill="#334155">
    <rect x="36" y="52" width="150" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="111" y="78" text-anchor="middle">관리자가</text>
    <text x="111" y="94" text-anchor="middle">/admin/reservations 접근</text>

    <line x1="186" y1="84" x2="212" y2="84" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="214" y="52" width="150" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="289" y="78" text-anchor="middle">middleware.ts가</text>
    <text x="289" y="94" text-anchor="middle">쿠키 있는지 확인</text>

    <line x1="364" y1="84" x2="390" y2="84" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="392" y="52" width="120" height="64" rx="6" fill="#fef2f2" stroke="#ef4444"/>
    <text x="452" y="90" text-anchor="middle" fill="#7f1d1d">쿠키 없음</text>

    <line x1="512" y1="84" x2="538" y2="84" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="540" y="52" width="180" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="630" y="78" text-anchor="middle">/admin/login 으로</text>
    <text x="630" y="94" text-anchor="middle">리다이렉트</text>
  </g>

  <line x1="450" y1="136" x2="450" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#av)"/>

  <!-- Stage 2 -->
  <rect x="20" y="162" width="860" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="184" font-size="13" font-weight="700" fill="#0f172a">② 로그인</text>

  <g font-size="11" fill="#334155">
    <rect x="36" y="198" width="170" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="121" y="224" text-anchor="middle">로그인 페이지에서</text>
    <text x="121" y="240" text-anchor="middle">비밀번호 제출</text>

    <line x1="206" y1="230" x2="232" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="234" y="198" width="190" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="329" y="224" text-anchor="middle">Server Action이</text>
    <text x="329" y="240" text-anchor="middle">ADMIN_PASSWORD와 비교</text>

    <line x1="424" y1="230" x2="450" y2="230" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="452" y="198" width="180" height="64" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="542" y="224" text-anchor="middle" fill="#065f46">일치하면 서명 쿠키</text>
    <text x="542" y="240" text-anchor="middle" fill="#065f46">발급 (7일)</text>

    <line x1="632" y1="230" x2="658" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="660" y="198" width="180" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="750" y="224" text-anchor="middle">/admin/reservations로</text>
    <text x="750" y="240" text-anchor="middle">리다이렉트</text>
  </g>

  <line x1="450" y1="282" x2="450" y2="306" stroke="#94a3b8" stroke-width="2" marker-end="url(#av)"/>

  <!-- Stage 3 -->
  <rect x="20" y="308" width="860" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="330" font-size="13" font-weight="700" fill="#0f172a">③ 예약 목록 조회</text>

  <g font-size="10.5" fill="#334155">
    <rect x="30" y="344" width="150" height="68" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="105" y="368" text-anchor="middle">middleware.ts</text>
    <text x="105" y="384" text-anchor="middle">쿠키 검증 통과</text>

    <line x1="180" y1="378" x2="200" y2="378" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="202" y="344" width="150" height="68" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="277" y="368" text-anchor="middle">목록 페이지가</text>
    <text x="277" y="384" text-anchor="middle">getReservations() 호출</text>

    <line x1="352" y1="378" x2="372" y2="378" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="374" y="344" width="150" height="68" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="449" y="368" text-anchor="middle">백엔드에 GET 요청</text>
    <text x="449" y="384" text-anchor="middle">(x-admin-key 포함)</text>

    <line x1="524" y1="378" x2="544" y2="378" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="546" y="344" width="150" height="68" rx="6" fill="#fff7ed" stroke="#d97706"/>
    <text x="621" y="368" text-anchor="middle" fill="#7c2d12">AdminKeyGuard 통과</text>
    <text x="621" y="384" text-anchor="middle" fill="#7c2d12">→ DB 조회</text>

    <line x1="696" y1="378" x2="716" y2="378" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="718" y="344" width="150" height="68" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="793" y="378" text-anchor="middle" fill="#065f46">목록 화면 렌더</text>
  </g>

  <line x1="450" y1="438" x2="450" y2="462" stroke="#94a3b8" stroke-width="2" marker-end="url(#av)"/>

  <!-- Stage 4 -->
  <rect x="20" y="464" width="860" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="486" font-size="13" font-weight="700" fill="#0f172a">④ 목록에서 상세로 이동</text>

  <g font-size="11" fill="#334155">
    <rect x="36" y="500" width="150" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="111" y="536" text-anchor="middle">목록에서 행 클릭</text>

    <line x1="186" y1="532" x2="212" y2="532" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="214" y="500" width="180" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="304" y="526" text-anchor="middle">getReservationById(id)</text>
    <text x="304" y="542" text-anchor="middle">호출</text>

    <line x1="394" y1="532" x2="420" y2="532" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="422" y="500" width="180" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="512" y="526" text-anchor="middle">백엔드 GET</text>
    <text x="512" y="542" text-anchor="middle">/reservations/:id</text>

    <line x1="602" y1="532" x2="628" y2="532" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="630" y="500" width="210" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="735" y="526" text-anchor="middle">있으면 상세 표시</text>
    <text x="735" y="542" text-anchor="middle">없으면 404 안내</text>
  </g>

  <text x="450" y="615" font-size="12" fill="#64748b" text-anchor="middle">모든 단계에서 브라우저는 백엔드를 직접 호출하지 않고 항상 프런트엔드 서버를 거침</text>
</svg>
