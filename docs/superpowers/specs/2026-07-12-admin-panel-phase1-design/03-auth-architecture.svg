<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="820" height="620" fill="#ffffff"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- lane headers -->
  <rect x="60" y="16" width="160" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="41" font-size="13" fill="#1e3a8a" text-anchor="middle">브라우저 (관리자)</text>

  <rect x="330" y="16" width="180" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="41" font-size="13" fill="#065f46" text-anchor="middle">프런트엔드 서버</text>

  <rect x="610" y="16" width="180" height="40" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="700" y="41" font-size="13" fill="#581c87" text-anchor="middle">백엔드 서버</text>

  <!-- lifelines -->
  <line x1="140" y1="56" x2="140" y2="590" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="420" y1="56" x2="420" y2="590" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="700" y1="56" x2="700" y2="590" stroke="#cbd5e1" stroke-width="2"/>

  <!-- step 1 -->
  <line x1="140" y1="90" x2="415" y2="90" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="145" y="82" font-size="12" fill="#334155">① 비밀번호 입력해서 로그인 요청</text>

  <!-- step 2 self note -->
  <rect x="425" y="105" width="220" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="435" y="126" font-size="12" fill="#334155">② 저장된 ADMIN_PASSWORD와 비교</text>

  <!-- step 3 -->
  <line x1="420" y1="160" x2="145" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="152" font-size="12" fill="#334155">③ 로그인 정보(쿠키) 저장</text>

  <line x1="40" y1="185" x2="790" y2="185" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">이후 관리자 화면에 들어갈 때마다</text>

  <!-- step 4 -->
  <line x1="140" y1="230" x2="415" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="145" y="222" font-size="12" fill="#334155">④ 예약 목록 페이지 요청 (쿠키 포함)</text>

  <!-- step 5 self note -->
  <rect x="425" y="245" width="220" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="435" y="266" font-size="12" fill="#334155">⑤ 쿠키 서명이 맞는지 확인</text>

  <!-- step 6 -->
  <line x1="420" y1="300" x2="695" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="425" y="292" font-size="12" fill="#334155">⑥ 예약 목록 요청 + x-admin-key 헤더</text>

  <!-- step 7 self note -->
  <rect x="500" y="315" width="220" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="336" font-size="12" fill="#334155">⑦ AdminKeyGuard가 키 값 비교</text>

  <!-- step 8 -->
  <line x1="700" y1="370" x2="425" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="362" font-size="12" fill="#334155">⑧ 예약 목록 데이터 응답</text>

  <!-- step 9 -->
  <line x1="420" y1="410" x2="145" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="402" font-size="12" fill="#334155">⑨ 목록 화면 표시</text>

  <!-- footer note -->
  <rect x="40" y="450" width="740" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="478" font-size="13" font-weight="700" fill="#78350f">시크릿 2개는 서로 완전히 분리되어 있음</text>
  <text x="60" y="504" font-size="12" fill="#78350f">- ADMIN_PASSWORD: 관리자가 로그인 폼에 입력하는 값 (프런트엔드만 알고 있음)</text>
  <text x="60" y="526" font-size="12" fill="#78350f">- ADMIN_API_KEY: 프런트 서버가 백엔드를 부를 때 쓰는 값 (백엔드·프런트 둘 다 알고 있음)</text>
  <text x="60" y="552" font-size="12" fill="#78350f">→ 백엔드는 로그인·비밀번호를 전혀 모르고, x-admin-key 값만 확인함</text>
  <text x="60" y="574" font-size="12" fill="#78350f">→ 브라우저는 여전히 백엔드를 직접 호출하지 않고 항상 프런트 서버를 거침</text>
</svg>
