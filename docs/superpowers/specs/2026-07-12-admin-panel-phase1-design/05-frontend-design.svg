<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">apps/frontend에 새로 추가되는 파일</text>

  <!-- middleware card -->
  <rect x="20" y="50" width="860" height="70" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="76" font-size="14" font-weight="700" fill="#7c2d12">middleware.ts (신규, 프로젝트 루트)</text>
  <text x="40" y="98" font-size="12" fill="#7c2d12">/admin/* 로 오는 모든 요청을 로그인 페이지 전에 가로채서, 로그인 정보(쿠키)가 있는지 먼저 확인함</text>

  <!-- lib card -->
  <rect x="20" y="140" width="410" height="400" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="168" font-size="14" font-weight="700" fill="#1e3a8a">lib/</text>

  <rect x="40" y="184" width="370" height="100" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="206" font-size="13" font-weight="700" fill="#1e3a8a">session.ts (신규)</text>
  <text x="56" y="228" font-size="12" fill="#334155">로그인 정보를 만들고, 그 정보가 진짜인지 확인하는 코드</text>
  <text x="56" y="250" font-size="12" fill="#334155">(middleware.ts와 로그인/로그아웃이 같이 씀)</text>

  <rect x="40" y="296" width="370" height="90" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="318" font-size="13" font-weight="700" fill="#1e3a8a">api.ts (수정)</text>
  <text x="56" y="340" font-size="12" fill="#334155">getReservations(), getReservationById(id) 추가</text>
  <text x="56" y="362" font-size="12" fill="#334155">(x-admin-key 헤더를 붙여서 백엔드 호출)</text>

  <rect x="40" y="398" width="370" height="90" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="420" font-size="13" font-weight="700" fill="#1e3a8a">actions.ts (수정)</text>
  <text x="56" y="444" font-size="12" fill="#334155">loginAdmin() — 비밀번호 확인 후 쿠키 발급</text>
  <text x="56" y="466" font-size="12" fill="#334155">logoutAdmin() — 쿠키 삭제</text>

  <!-- app card -->
  <rect x="450" y="140" width="430" height="400" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="168" font-size="14" font-weight="700" fill="#065f46">app/admin/ (새 페이지들)</text>

  <rect x="470" y="184" width="390" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="486" y="206" font-size="13" font-weight="700" fill="#065f46">login/page.tsx</text>
  <text x="486" y="224" font-size="12" fill="#334155">비밀번호 입력 폼</text>

  <rect x="470" y="252" width="390" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="486" y="274" font-size="13" font-weight="700" fill="#065f46">page.tsx</text>
  <text x="486" y="292" font-size="12" fill="#334155">/admin/reservations 로 자동 이동</text>

  <rect x="470" y="320" width="390" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="486" y="342" font-size="13" font-weight="700" fill="#065f46">reservations/page.tsx</text>
  <text x="486" y="360" font-size="12" fill="#334155">예약 신청 목록 (최신순)</text>

  <rect x="470" y="388" width="390" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="486" y="410" font-size="13" font-weight="700" fill="#065f46">reservations/[id]/page.tsx</text>
  <text x="486" y="428" font-size="12" fill="#334155">예약 신청 상세 (없으면 404)</text>

  <rect x="470" y="456" width="390" height="70" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="486" y="488" font-size="12" fill="#065f46">로그인 안 한 상태로 이 페이지들에 직접 들어오면</text>
  <text x="486" y="508" font-size="12" fill="#065f46">middleware.ts가 /admin/login으로 돌려보냄</text>
</svg>
