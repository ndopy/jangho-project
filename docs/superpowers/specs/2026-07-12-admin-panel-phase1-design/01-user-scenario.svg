<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="760" height="900" fill="#ffffff"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="agreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="280" y="20" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="50" font-size="13" fill="#334155" text-anchor="middle">/admin 주소로 접속</text>
  <line x1="380" y1="70" x2="380" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="230" y="100" width="300" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="130" font-size="13" fill="#334155" text-anchor="middle">로그인 안 됨 → 로그인 페이지로 이동</text>
  <line x1="380" y1="150" x2="380" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="260" y="180" width="240" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="210" font-size="13" fill="#1e3a8a" text-anchor="middle">비밀번호 입력 후 로그인 클릭</text>
  <line x1="380" y1="230" x2="380" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision -->
  <polygon points="380,260 480,310 380,360 280,310" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="306" font-size="13" fill="#7c2d12" text-anchor="middle">비밀번호가</text>
  <text x="380" y="322" font-size="13" fill="#7c2d12" text-anchor="middle">맞는가?</text>

  <!-- no branch -->
  <line x1="480" y1="310" x2="580" y2="310" stroke="#ef4444" stroke-width="2" marker-end="url(#ared)"/>
  <text x="530" y="300" font-size="12" fill="#b91c1c" text-anchor="middle">아니오</text>
  <rect x="560" y="285" width="180" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="650" y="308" font-size="12" fill="#7f1d1d" text-anchor="middle">"비밀번호가 틀렸습니다"</text>
  <text x="650" y="324" font-size="12" fill="#7f1d1d" text-anchor="middle">문구 표시, 로그인 안 됨</text>
  <path d="M650,285 C650,250 400,235 385,258" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ared)"/>

  <!-- yes branch -->
  <line x1="380" y1="360" x2="380" y2="388" stroke="#10b981" stroke-width="2" marker-end="url(#agreen)"/>
  <text x="410" y="378" font-size="12" fill="#065f46">예</text>

  <!-- 4 -->
  <rect x="230" y="390" width="300" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="412" font-size="13" fill="#065f46" text-anchor="middle">로그인 정보를 브라우저에 저장</text>
  <text x="380" y="430" font-size="12" fill="#065f46" text-anchor="middle">(7일간 유지)</text>
  <line x1="380" y1="440" x2="380" y2="468" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 -->
  <rect x="230" y="470" width="300" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="500" font-size="13" fill="#334155" text-anchor="middle">예약 신청 목록 페이지로 이동</text>
  <line x1="380" y1="520" x2="380" y2="548" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 -->
  <rect x="200" y="550" width="360" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="575" font-size="13" fill="#334155" text-anchor="middle">목록에서 한 줄 클릭</text>
  <text x="380" y="595" font-size="12" fill="#334155" text-anchor="middle">(날짜·이름·연락처가 나열된 목록)</text>
  <line x1="380" y1="610" x2="380" y2="638" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 7 branch: detail vs not found -->
  <rect x="150" y="640" width="260" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="665" font-size="13" fill="#334155" text-anchor="middle">신청 상세 페이지</text>
  <text x="280" y="683" font-size="12" fill="#334155" text-anchor="middle">(희망일자·인원·요청사항)</text>

  <rect x="440" y="640" width="260" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="570" y="663" font-size="12" fill="#7f1d1d" text-anchor="middle">존재하지 않는 번호면</text>
  <text x="570" y="681" font-size="12" fill="#7f1d1d" text-anchor="middle">"그런 신청은 없습니다" 안내</text>

  <line x1="380" y1="610" x2="280" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="610" x2="570" y2="640" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a)"/>

  <line x1="280" y1="700" x2="280" y2="728" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 8 logout -->
  <rect x="150" y="730" width="260" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="760" font-size="13" fill="#1e3a8a" text-anchor="middle">로그아웃 버튼 클릭</text>
  <line x1="280" y1="780" x2="280" y2="808" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="150" y="810" width="260" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="840" font-size="13" fill="#334155" text-anchor="middle">저장된 로그인 정보 삭제</text>

  <path d="M410,835 C 560,835 560,130 385,120" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="540" y="480" font-size="12" fill="#64748b" text-anchor="middle">다시 로그인 페이지로</text>
</svg>
