<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1180" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="940" height="1180" fill="#ffffff"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="agreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ① -->
  <rect x="40" y="20" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="60" font-size="13" fill="#334155" text-anchor="middle">① /admin 주소로 접속</text>
  <line x1="190" y1="90" x2="190" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ② -->
  <rect x="40" y="130" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="160" font-size="13" fill="#334155" text-anchor="middle">② 로그인 안 됨</text>
  <text x="190" y="180" font-size="13" fill="#334155" text-anchor="middle">로그인 페이지로 이동</text>
  <line x1="190" y1="200" x2="190" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ③ -->
  <rect x="40" y="240" width="300" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="270" font-size="13" fill="#1e3a8a" text-anchor="middle">③ 비밀번호 입력 후</text>
  <text x="190" y="290" font-size="13" fill="#1e3a8a" text-anchor="middle">로그인 클릭</text>
  <line x1="190" y1="310" x2="190" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision ④ -->
  <polygon points="190,350 340,405 190,460 40,405" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="190" y="400" font-size="13" fill="#7c2d12" text-anchor="middle">④ 비밀번호가</text>
  <text x="190" y="418" font-size="13" fill="#7c2d12" text-anchor="middle">맞는가?</text>

  <!-- no branch: diamond right -> error box -->
  <line x1="340" y1="405" x2="420" y2="405" stroke="#ef4444" stroke-width="2" marker-end="url(#ared)"/>
  <text x="380" y="395" font-size="12" fill="#b91c1c" text-anchor="middle">아니오</text>

  <rect x="420" y="370" width="300" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="570" y="400" font-size="13" fill="#7f1d1d" text-anchor="middle">"비밀번호가 틀렸습니다"</text>
  <text x="570" y="420" font-size="13" fill="#7f1d1d" text-anchor="middle">문구 표시, 다시 입력 대기</text>

  <!-- no branch loop back to ③, left-side channel, all right angles -->
  <path d="M 570,370 L 570,220 L 10,220 L 10,275 L 40,275" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ared)"/>

  <!-- yes branch -->
  <line x1="190" y1="460" x2="190" y2="500" stroke="#10b981" stroke-width="2" marker-end="url(#agreen)"/>
  <text x="220" y="485" font-size="12" fill="#065f46">예</text>

  <!-- ⑤ -->
  <rect x="40" y="500" width="300" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="190" y="530" font-size="13" fill="#065f46" text-anchor="middle">⑤ 로그인 정보를</text>
  <text x="190" y="550" font-size="13" fill="#065f46" text-anchor="middle">브라우저에 저장 (7일간 유지)</text>
  <line x1="190" y1="570" x2="190" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑥ -->
  <rect x="40" y="610" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="640" font-size="13" fill="#334155" text-anchor="middle">⑥ 예약 신청 목록</text>
  <text x="190" y="660" font-size="13" fill="#334155" text-anchor="middle">페이지로 이동</text>
  <line x1="190" y1="680" x2="190" y2="720" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑦ -->
  <rect x="40" y="720" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="750" font-size="13" fill="#334155" text-anchor="middle">⑦ 목록에서</text>
  <text x="190" y="770" font-size="13" fill="#334155" text-anchor="middle">한 줄 클릭</text>

  <!-- split: down to detail, right-then-down to 404 -->
  <line x1="190" y1="790" x2="190" y2="830" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 190,800 L 400,800 L 400,865 L 420,865" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a)"/>

  <!-- ⑧ detail -->
  <rect x="40" y="830" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="860" font-size="13" fill="#334155" text-anchor="middle">⑧ 신청 상세 페이지</text>
  <text x="190" y="880" font-size="13" fill="#334155" text-anchor="middle">(희망일자·인원·요청사항)</text>

  <!-- 404 -->
  <rect x="420" y="830" width="300" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="570" y="860" font-size="13" fill="#7f1d1d" text-anchor="middle">존재하지 않는 번호면</text>
  <text x="570" y="880" font-size="13" fill="#7f1d1d" text-anchor="middle">"그런 신청 없음" 안내</text>

  <line x1="190" y1="900" x2="190" y2="940" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑨ -->
  <rect x="40" y="940" width="300" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="980" font-size="13" fill="#1e3a8a" text-anchor="middle">⑨ 로그아웃 버튼 클릭</text>
  <line x1="190" y1="1010" x2="190" y2="1050" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑩ -->
  <rect x="40" y="1050" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="1090" font-size="13" fill="#334155" text-anchor="middle">⑩ 저장된 로그인 정보 삭제</text>

  <!-- loop back to ②, far-right channel, all right angles -->
  <path d="M 340,1085 L 800,1085 L 800,115 L 190,115 L 190,130" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="800" y="600" font-size="12" fill="#64748b" text-anchor="middle" transform="rotate(-90 800 600)">다시 로그인 페이지로</text>
</svg>
