  <line x1="320" y1="248" x2="578" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="578" y1="266" x2="320" y2="266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="330" font-size="12.5" fill="#1b2634" text-anchor="middle">확인과 보류 사이는 버튼을 눌러 언제든 서로 다시 바꿀 수 있다</text>
  <text x="450" y="360" font-size="12.5" fill="#1b2634" text-anchor="middle">(대기로 되돌리는 버튼은 없다 — 이번 범위 밖)</text>
